"Alt + X" = { switch_to_workspace = 27 }
"Alt + Y" = { switch_to_workspace = 28 }
"Alt + Z" = { switch_to_workspace = 29 }

"alt-s + 0" = { move_window_to_workspace = 0 }
"alt-s + 1" = { move_window_to_workspace = 1 }
"alt-s + 2" = { move_window_to_workspace = 2 }
"alt-s + 3" = { move_window_to_workspace = 3 }
"alt-s + 4" = { move_window_to_workspace = 4 }
"alt-s + 5" = { move_window_to_workspace = 5 }
"alt-s + 6" = { move_window_to_workspace = 6 }
"alt-s + 7" = { move_window_to_workspace = 7 }
"alt-s + 8" = { move_window_to_workspace = 8 }
"alt-s + 9" = { move_window_to_workspace = 9 }
"alt-s + A" = { move_window_to_workspace = 10 }
"alt-s + B" = { move_window_to_workspace = 11 }
"alt-s + C" = { move_window_to_workspace = 12 }
"alt-s + D" = { move_window_to_workspace = 13 }
"alt-s + E" = { move_window_to_workspace = 14 }
"alt-s + F" = { move_window_to_workspace = 15 }
"alt-s + G" = { move_window_to_workspace = 16 }
"alt-s + I" = { move_window_to_workspace = 17 }
"alt-s + M" = { move_window_to_workspace = 18 }
"alt-s + O" = { move_window_to_workspace = 19 }
"alt-s + P" = { move_window_to_workspace = 20 }
"alt-s + Q" = { move_window_to_workspace = 21 }
"alt-s + R" = { move_window_to_workspace = 22 }
"alt-s + S" = { move_window_to_workspace = 23 }
"alt-s + T" = { move_window_to_workspace = 24 }
"alt-s + U" = { move_window_to_workspace = 25 }
"alt-s + W" = { move_window_to_workspace = 26 }
"alt-s + X" = { move_window_to_workspace = 27 }
"alt-s + Y" = { move_window_to_workspace = 28 }
"alt-s + Z" = { move_window_to_workspace = 29 }

"Alt + Tab" = "switch_to_last_workspace"
"alt-s + Tab" = { move_workspace_to_display = { selector = "right", wrap_around = true } }

"Alt + N" = { binding_mode = "open" }
"alt-s + Semicolon" = { binding_mode = "service" }

# chained shortcuts
"alt-c + T" = { exec = "/Applications/Ghostty.app/Contents/MacOS/ghostty" }
"alt-c + S" = { exec = ["/bin/sh", "-c", "osascript -e 'tell application \"Safari\" to make new document at end of documents' -e 'tell application \"Safari\" to activate'"] }
"alt-c + C" = { exec = ["/bin/sh", "-c", """
  osascript \
    -e 'try' \
    -e '  tell application "/Applications/Helium.app" to make new window' \
    -e '  tell application "/Applications/Helium.app" to activate' \
    -e 'on error' \
    -e '  tell application "/Applications/Google Chrome.app" to make new window' \
    -e '  tell application "/Applications/Google Chrome.app" to activate' \
    -e 'end try'
"""] }
"alt-c + F" = "toggle_fullscreen_within_gaps"
"alt-c + R" = "toggle_window_floating"
"alt-c + X" = "toggle_space_activated"

# Binding modes hold one command per key, so each action that should also
# return to the default keymap (aerospace's trailing 'mode main') runs
# `rift-cli execute binding-mode default` first, then the action.

[binding_modes.open]
"Escape" = { binding_mode = "default" }
"T" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; /Applications/Ghostty.app/Contents/MacOS/ghostty"] }
"W" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; /Applications/Ghostty.app/Contents/MacOS/ghostty -e spacelist"] }
"C" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; osascript -e 'tell application \"/Applications/Google Chrome.app\" to make new window' -e 'tell application \"/Applications/Google Chrome.app\" to activate'"] }
"S" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; osascript -e 'tell application \"Safari\" to make new document at end of documents' -e 'tell application \"Safari\" to activate'"] }
"F" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; osascript -e 'tell application \"Finder\" to make new Finder window' -e 'tell application \"Finder\" to activate'"] }
"B" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; sketchybar"] }

[binding_modes.service]
"Escape" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; sketchybar --reload ~/.config/sketchybar/sketchybarrc; rift-cli execute config reload"] }
"T" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; rift-cli execute window toggle-float"] }
"F" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; rift-cli execute window toggle-fullscreen-within-gaps"] }
# close every other window on the active workspace
"Backspace" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; rift-cli query workspaces | jq -r '.[] | select(.is_active) | .windows[] | select(.is_focused | not) | .window_server_id // empty' | while read -r id; do rift-cli execute window close --window-id \"$id\"; done"] }

"Alt + Shift + H" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; rift-cli execute layout join-window left"] }
"Alt + Shift + K" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; rift-cli execute layout join-window down"] }
"Alt + Shift + J" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; rift-cli execute layout join-window up"] }
"Alt + Shift + L" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; rift-cli execute layout join-window right"] }

"Down" = { exec = ["/bin/sh", "-c", "osascript -e 'set volume output volume ((output volume of (get volume settings)) - 6.25)'"] }
"Up" = { exec = ["/bin/sh", "-c", "osascript -e 'set volume output volume ((output volume of (get volume settings)) + 6.25)'"] }
"Shift + Down" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default; osascript -e 'set volume output volume 0'"] }
